# Plantilla local. En CI se regenera con secrets.
# Configura SONAR_PROJECT_KEY y SONAR_ORGANIZATION en GitHub Secrets.

sonar.projectKey=REPLACE_WITH_SONAR_PROJECT_KEY
sonar.organization=REPLACE_WITH_SONAR_ORGANIZATION
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,frontend/**,services/**,**/*.test.ts
sonar.test.inclusions=test/**/*.ts
sonar.qualitygate.wait=true
